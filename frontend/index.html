<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SHEild Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <div class="login-container">
                <div class="login-card">
            <img src="assets/logo.png" alt="SHEild Logo" class="login-logo" style="width: 76px; height: 76px; border-radius: 18px; margin: 0 auto 16px; display: block; box-shadow: 0 4px 14px rgba(42, 115, 225, 0.22); border: 1px solid #E2E8F0;">
            <h1 style="font-size: 26px; font-weight: 800; margin-bottom: 4px; letter-spacing: -0.3px;"><span style="color: #005BBF;">SHE</span><span style="color: #191C1D;">ild</span></h1>
            <p style="font-size: 13px; color: #64748B; margin-bottom: 24px;">Admin Control Center</p>
            <button class="google-btn" id="loginBtn">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
                Sign in with Google
            </button>
            <p id="errorMsg" style="color: var(--sos-red); margin-top: 16px; display: none;"></p>
        </div>
    </div>

    <!-- Firebase JS SDK -->
    <script type="module" src="scripts/auth.js?v=5"></script>
</body>
</html>
